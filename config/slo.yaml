service: day13-l3b-monitoring-llmops-lab

# SLO chính: "request thành công và đủ nhanh".
# Lý do chọn ngưỡng 3000ms: baseline thực đo trên máy cá nhân cho P95 ~160-800ms
# (xem submission/evidence/baseline-00-validators.txt và 02-log-validator).
# 3000ms là mức trần còn chấp nhận được với người dùng chat, đồng thời rộng hơn
# baseline ~4-18 lần nên không báo động giả, nhưng vẫn bắt được sự cố thật
# (scenario rag_slow thêm ~2500ms vào span retrieval -> P95 vượt 3000ms).
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    SLO 99.5% trong cửa sổ 28 ngày nghĩa là error budget 0.5%. Nếu workload có
    10,000 request thì tối đa 50 request được phép lỗi hoặc chậm hơn 3000ms.
    Cụ thể hơn: với 100 request thì error budget là 0.5 request — tức gần như
    không được phép có request nào vượt ngưỡng. Error budget cháy nhanh (burn
    rate cao) là tín hiệu phải dừng release và điều tra ngay.

# Guardrail là ngưỡng cứng bảo vệ các mặt khác của hệ thống, không phải SLO
# chính. Ba alert bên dưới symptom-based và bám vào các guardrail này.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
